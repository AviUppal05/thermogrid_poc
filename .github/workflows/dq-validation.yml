# ============================================================
# GitHub Actions: ThermoGrid DQ Validation
# ============================================================
# Stage 6: range checks, duplicate validation, quarantine table for
# critical rows, and a persisted DQ log. Reads staging/, writes
# dq_validated/, quarantine/, dq_logs/.
#
# Triggered automatically after "Build Staging" finishes successfully.
# ============================================================

name: DQ Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Staging"]
    types: [completed]

concurrency:
  group: dq-validation
  cancel-in-progress: false

jobs:
  dq-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      PYTHONUNBUFFERED: "1"
      HF_ACCESS_KEY_ID:     ${{ secrets.HF_ACCESS_KEY_ID }}
      HF_SECRET_ACCESS_KEY: ${{ secrets.HF_SECRET_ACCESS_KEY }}
      HF_NAMESPACE:         ${{ secrets.HF_NAMESPACE }}
      HF_BUCKET_NAME:       ${{ secrets.HF_BUCKET_NAME }}

    defaults:
      run:
        working-directory: ./processing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets are set
        run: |
          if [ -z "$HF_ACCESS_KEY_ID" ] || [ -z "$HF_SECRET_ACCESS_KEY" ] || [ -z "$HF_NAMESPACE" ] || [ -z "$HF_BUCKET_NAME" ]; then
            echo "::error::Missing required secrets."
            exit 1
          fi

      - name: Run DQ Validation
        id: dq
        run: python dq_validation.py

      - name: Summary
        if: always()
        run: |
          echo "## 🔍 DQ Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Rows | ${{ steps.dq.outputs.total_rows || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clean      | ${{ steps.dq.outputs.total_clean || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Warning    | ${{ steps.dq.outputs.total_warning || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical (quarantined copy) | ${{ steps.dq.outputs.total_critical || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Duplicates Found (should be 0) | ${{ steps.dq.outputs.total_duplicates_found || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY