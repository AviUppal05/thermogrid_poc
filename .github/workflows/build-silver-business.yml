# ============================================================
# GitHub Actions: ThermoGrid Silver Business Transform
# ============================================================
# Stage 8: business transformations, telemetry enrichment, KPI
# calculations - at ROW level (Gold, not this stage, does aggregation).
# HVAC reads from fault_detection/, utility reads from dq_validated/
# (utility has no fault-detection stage of its own). Both write to
# silver/<dataset>.
#
# Triggered automatically after "Fault Detection" finishes
# successfully, since that's the later of the two upstream stages.
# ============================================================

name: Build Silver Business Transform

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Fault Detection"]
    types: [completed]

concurrency:
  group: build-silver-business
  cancel-in-progress: false

jobs:
  build-silver-business:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      HF_ACCESS_KEY_ID:     ${{ secrets.HF_ACCESS_KEY_ID }}
      HF_SECRET_ACCESS_KEY: ${{ secrets.HF_SECRET_ACCESS_KEY }}
      HF_NAMESPACE:         ${{ secrets.HF_NAMESPACE }}
      HF_BUCKET_NAME:       ${{ secrets.HF_BUCKET_NAME }}

    defaults:
      run:
        working-directory: ./processing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets are set
        run: |
          if [ -z "$HF_ACCESS_KEY_ID" ] || [ -z "$HF_SECRET_ACCESS_KEY" ] || [ -z "$HF_NAMESPACE" ] || [ -z "$HF_BUCKET_NAME" ]; then
            echo "::error::Missing required secrets."
            exit 1
          fi

      - name: Build Silver Business Transform
        id: silver
        run: python silver_business_transform.py

      - name: Summary
        if: always()
        run: |
          echo "## 🥈 Silver Business Transform Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Rows | ${{ steps.silver.outputs.total_rows || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rows With Computed KPIs | ${{ steps.silver.outputs.total_enriched || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY