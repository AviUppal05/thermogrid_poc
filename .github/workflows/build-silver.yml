# ============================================================
# GitHub Actions: ThermoGrid Silver Build
# ============================================================
# Reads the Bronze Delta tables, type-casts, and adds non-destructive
# data quality flags, writing the result to silver/<dataset>.
#
# Triggered automatically after "Compact Bronze" finishes successfully
# (rather than a fixed cron offset), so Silver always runs against
# fresh Bronze data without needing to guess how long Bronze takes.
#
# Required Repository Secrets (same as the other jobs):
#   HF_ACCESS_KEY_ID
#   HF_SECRET_ACCESS_KEY
#   HF_NAMESPACE
#   HF_BUCKET_NAME
# ============================================================

name: Build Silver

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Compact Bronze"]
    types: [completed]

concurrency:
  group: build-silver
  cancel-in-progress: false

jobs:
  build-silver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run if triggered manually, or if Bronze actually succeeded -
    # no point building Silver from a Bronze run that failed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      HF_ACCESS_KEY_ID:     ${{ secrets.HF_ACCESS_KEY_ID }}
      HF_SECRET_ACCESS_KEY: ${{ secrets.HF_SECRET_ACCESS_KEY }}
      HF_NAMESPACE:         ${{ secrets.HF_NAMESPACE }}
      HF_BUCKET_NAME:       ${{ secrets.HF_BUCKET_NAME }}

    defaults:
      run:
        working-directory: ./processing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets are set
        run: |
          if [ -z "$HF_ACCESS_KEY_ID" ] || [ -z "$HF_SECRET_ACCESS_KEY" ] || [ -z "$HF_NAMESPACE" ] || [ -z "$HF_BUCKET_NAME" ]; then
            echo "::error::Missing required secrets."
            exit 1
          fi

      - name: Build Silver
        id: silver
        run: python silver_build.py

      - name: Summary
        if: always()
        run: |
          echo "## 🥈 Silver Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Rows | ${{ steps.silver.outputs.total_rows || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clean      | ${{ steps.silver.outputs.total_clean || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Warning    | ${{ steps.silver.outputs.total_warning || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical   | ${{ steps.silver.outputs.total_critical || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY